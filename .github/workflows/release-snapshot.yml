name: Upload Release Snapshot

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  snapshot:
    name: Take and Upload UI Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        working-directory: src/web
        run: npm ci

      - name: Install Playwright
        working-directory: src/web
        run: npx playwright install --with-deps chromium

      - name: Build Next.js App
        working-directory: src/web
        run: npm run build

      - name: Take Snapshot
        working-directory: src/web
        run: |
          # 백그라운드에서 정적 서버 실행
          npx serve@latest out -l 3333 &
          SERVER_PID=$!
          
          # 서버가 뜰 때까지 대기
          sleep 3
          
          # Playwright 스크립트 작성 및 실행
          cat << 'JS_EOF' > take-snapshot.mjs
          import { chromium } from 'playwright';
          (async () => {
            const browser = await chromium.launch();
            // 프로토타입 시각 규격(wave-and-vibe-console.html)에 맞춰 넓게 해상도 설정
            const page = await browser.newPage({ viewport: { width: 1440, height: 1080 } });
            
            await page.goto('http://localhost:3333', { waitUntil: 'networkidle' });
            // 클라이언트 사이드 렌더링 및 애니메이션 완료 대기
            await page.waitForTimeout(1500); 
            
            const tagName = process.env.GITHUB_REF_NAME || 'snapshot';
            const filename = `dashboard-${tagName}.png`;
            
            await page.screenshot({ path: filename, fullPage: true });
            console.log(`✅ Snapshot saved to ${filename}`);
            await browser.close();
          })();
          JS_EOF
          
          node take-snapshot.mjs
          
          # 서버 종료
          kill $SERVER_PID

      - name: Upload to Release
        working-directory: src/web
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${{ github.ref_name }}
          gh release upload "$TAG_NAME" "dashboard-${TAG_NAME}.png" --clobber
