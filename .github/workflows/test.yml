name: Test

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  tokens:
    name: 디자인 토큰 정합 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 브라우저가 필요 없는 node 프로젝트만 돌린다.
      # 스토리 상호작용 테스트는 Chromatic 의 UI Tests 가 담당한다.
      - name: Check design tokens against prototype
        run: npm run test:tokens
