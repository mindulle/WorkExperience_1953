name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # 코드 변경 없이 재배포가 필요할 때 수동 실행

# 배포가 겹치면 오래된 커밋이 나중에 반영될 수 있으므로 순차 실행
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy dashboard to Cloudflare Workers
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://workexpr.proto.sonagi.space
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build # next.config.ts의 output:"export" 설정으로 out/ 생성

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/web
          wranglerVersion: "4.115.0" # 로컬에서 배포 검증한 버전으로 고정
